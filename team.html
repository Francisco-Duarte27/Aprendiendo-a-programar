<!DOCTYPE html>
<!-- saved from url=(0014)about:internet -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet the Pet Nova Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./css2" rel="stylesheet">
<style>
  :root{
    --ink:#132a26;
    --cream:#faf6ee;
    --teal-deep:#173f39;
    --teal:#1f5c52;
    --apricot:#f2a65a;
    --apricot-deep:#e08a34;
    --sky:#6fb8c4;
    --card-shadow: rgba(19,42,38,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding:40px 20px;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:1040px;
  }

  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:56px;
    align-items:center;
  }

  /* --- stacked photo card --- */
  .photo-wrap{
    position:relative;
    width:320px;
    height:380px;
  }
  .photo-wrap .deco{
    position:absolute;
    inset:0;
    border-radius:26px;
  }
  .deco.d1{
    background:var(--sky);
    transform:rotate(-9deg) translate(-14px,10px);
    opacity:0.55;
  }
  .deco.d2{
    background:var(--teal-deep);
    transform:rotate(6deg) translate(12px,-6px);
    opacity:0.85;
  }
  .paw-print{
    position:absolute;
    opacity:0.16;
  }

  .avatar-card{
    position:relative;
    width:100%;
    height:100%;
    border-radius:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 26px 40px -14px var(--card-shadow);
    overflow:hidden;
    transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
  }
  .avatar-card .initials{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:96px;
    color:rgba(255,255,255,0.94);
    letter-spacing:2px;
    z-index:2;
  }
  .avatar-card .ring{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.35);
  }
  .avatar-card .ring.r1{width:230px;height:230px;}
  .avatar-card .ring.r2{width:300px;height:300px;border-color:rgba(255,255,255,0.18);}

  .fade-in{animation:fadeIn .45s ease;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* --- text side --- */
  .info .name{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:28px;
    color:#ffffff;
    margin:0 0 4px 0;
  }
  .info .role{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:15px;
    color:#22d3ee;
    margin:0 0 22px 0;
    letter-spacing:0.02em;
  }
  .info .quote{
    font-family:'Inter', sans-serif;
    font-size:18px;
    line-height:1.6;
    color:#ffffff;
    max-width:460px;
    margin:0 0 32px 0;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .arrow-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 18px -8px rgba(19,42,38,0.35);
  }
  .arrow-btn:hover{transform:translateY(-2px);}
  .arrow-btn:active{transform:translateY(0px) scale(0.96);}
  .arrow-btn:focus-visible{outline:3px solid var(--sky); outline-offset:3px;}
  .arrow-btn.prev{background:#7c3aed;}
  .arrow-btn.next{background:#22d3ee;}
  .arrow-btn svg{width:20px;height:20px;}

  .counter{
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--teal);
    letter-spacing:0.04em;
    margin-left:6px;
  }

  .dots{
    display:flex;
    gap:8px;
    margin-top:22px;
  }
  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:rgba(31,92,82,0.25);
    border:none;
    cursor:pointer;
    padding:0;
    transition:background .2s ease, transform .2s ease;
  }
  .dot.active{
    background:var(--apricot-deep);
    transform:scale(1.25);
  }

  @media (max-width: 760px){
    .layout{grid-template-columns:1fr; gap:34px;}
    .photo-wrap{width:260px; height:300px; margin:0 auto;}
    .avatar-card .initials{font-size:74px;}
    .info{text-align:center;}
    .info .quote{margin-left:auto; margin-right:auto;}
    .controls{justify-content:center;}
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  .name{color:#fff;font-family:'Poppins',sans-serif;font-weight:700}
  .role{color:#22d3ee}
  .quote{color:#fff}
  .initials{color:#f1f5f4;font-family:'Playfair Display',serif}
  .counter{color:#2a5a52}
</style>
</head>
<body>

<div class="stage">
  <div class="layout">
    <div class="photo-wrap">
      <div class="deco d1"></div>
      <div class="deco d2"></div>
      <div class="avatar-card fade-in" id="avatarCard" style="background: rgb(31, 92, 82);">
        <div class="ring r2"></div>
        <div class="ring r1"></div>
        <span class="initials" id="initials">AS</span>
      </div>
    </div>

    <div class="info">
      <p class="name fade-in" id="name">Ayshell Sánchez</p>
      <p class="role">Pet Nova Team</p>
      <p class="quote fade-in" id="quote">Passionate about creating meaningful experiences that strengthen the bond between pets and their families.</p>

      <div class="controls">
        <button class="arrow-btn prev" id="prevBtn" aria-label="Previous team member">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <button class="arrow-btn next" id="nextBtn" aria-label="Next team member">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <span class="counter" id="counter">01 / 10</span>
      </div>

    </div>
  </div>
</div>

<script>
  const team = [
    {name:"Ayshell Sánchez", text:"Passionate about creating meaningful experiences that strengthen the bond between pets and their families.", color:"#1f5c52"},
    {name:"Oliver Montenegro", text:"Focused on turning creative ideas into practical solutions for pet owners.", color:"#e08a34"},
    {name:"Luis Chen", text:"Committed to developing innovative features that make pet care simpler and more accessible.", color:"#6fb8c4"},
    {name:"Francisco Duarte", text:"Driven by teamwork and creativity to build solutions that positively impact animal welfare.", color:"#173f39"},
    {name:"Valerie Rodríguez", text:"Dedicated to designing thoughtful experiences that put pets and their owners first.", color:"#c9704a"},
    {name:"Sofía Rodríguez", text:"Inspired by innovation and collaboration to create a better future for companion animals.", color:"#2f7d6f"},
    {name:"Elizabeth Reyes", text:"Passionate about combining creativity and technology to improve the lives of pets and their families.", color:"#4d9aa6"},
    {name:"Priscila Diez", text:"Committed to bringing fresh ideas that make caring for pets easier, safer, and more enjoyable.", color:"#d98c3d"},
    {name:"Danna Arjona", text:"Focused on creating innovative solutions that promote responsible pet ownership.", color:"#1f5c52"},
    {name:"Sthefanie Gaitán", text:"Motivated by collaboration and compassion to help build a smarter pet care experience.", color:"#3a6f63"}
  ];

  let index = 0;

  const nameEl = document.getElementById('name');
  const quoteEl = document.getElementById('quote');
  const initialsEl = document.getElementById('initials');
  const cardEl = document.getElementById('avatarCard');
  const counterEl = document.getElementById('counter');

  function getInitials(fullName){
    return fullName.split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase();
  }

  function render(){
    const member = team[index];
    cardEl.style.background = member.color;
    initialsEl.textContent = getInitials(member.name);
    nameEl.textContent = member.name;
    quoteEl.textContent = member.text;
    counterEl.textContent = String(index+1).padStart(2,'0') + ' / ' + team.length;

    cardEl.classList.remove('fade-in');
    void cardEl.offsetWidth;
    cardEl.classList.add('fade-in');

    nameEl.classList.remove('fade-in');
    void nameEl.offsetWidth;
    nameEl.classList.add('fade-in');
    quoteEl.classList.remove('fade-in');
    void quoteEl.offsetWidth;
    quoteEl.classList.add('fade-in');
  }

  function goTo(i){
    index = (i + team.length) % team.length;
    render();
  }

  document.getElementById('nextBtn').addEventListener('click', () => goTo(index+1));
  document.getElementById('prevBtn').addEventListener('click', () => goTo(index-1));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') goTo(index+1);
    if(e.key === 'ArrowLeft') goTo(index-1);
  });

  render();
</script>


</body></html>
